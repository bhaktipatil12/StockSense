version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stocksense_db
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense123
      POSTGRES_DB: stocksense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: stocksense_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stocksense:stocksense123@postgres:5432/stocksense_db
      SECRET_KEY: your-secret-key-change-this-in-production-stocksense-2026-inventory-system
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001

volumes:
  postgres_data:


